<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git 提交比对</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="12" r="3"></circle>
        <path d="M6 9v6M9 6h4a2 2 0 0 1 2 2v1M9 18h4a2 2 0 0 0 2-2v-1"></path>
      </svg>
      <!-- prize add by yanliang for 标题跟着打开的仓库名走, 20261027-start -->
      <span id="brandName">Git 提交比对</span>
      <!-- prize add by yanliang for 标题跟着打开的仓库名走, 20261027-end -->
    </div>

    <div class="repo-open">
      <!-- prize add by yanliang for 路径框内嵌目录选择按钮, 20261023-start -->
      <div class="repo-input-wrap">
        <input id="repoPath" type="text" spellcheck="false" placeholder="仓库路径，例如 D:\code\my-project" />
        <button id="repoPick" class="repo-pick" type="button" title="浏览磁盘，选择仓库目录" aria-label="浏览目录">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2h7A1.5 1.5 0 0 1 19 9.5v8A1.5 1.5 0 0 1 17.5 19h-13A1.5 1.5 0 0 1 3 17.5z"></path>
          </svg>
        </button>
      </div>
      <!-- prize add by yanliang for 路径框内嵌目录选择按钮, 20261023-end -->
      <button id="openRepo" class="btn primary">打开</button>
    </div>

    <!-- prize add by yanliang for 顶栏两个本地入口：打开目录 / 打开命令行, 20261028-start -->
    <div class="repo-tools">
      <button id="openDir" class="btn icon" type="button" title="在文件资源管理器中打开仓库目录" aria-label="打开目录" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2h7A1.5 1.5 0 0 1 19 9.5v8A1.5 1.5 0 0 1 17.5 19h-13A1.5 1.5 0 0 1 3 17.5z"></path>
          <path d="M3 11h16"></path>
        </svg>
      </button>
      <button id="openShell" class="btn icon" type="button" title="在这个目录打开命令行（Windows 用 cmd）" aria-label="打开命令行" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4.5" width="18" height="15" rx="2"></rect>
          <path d="M7 10l2.5 2.5L7 15M12.5 15H17"></path>
        </svg>
      </button>
    </div>
    <!-- prize add by yanliang for 顶栏两个本地入口：打开目录 / 打开命令行, 20261028-end -->

    <!-- prize add by yanliang for 顶栏 ADB 入口：检测连接并替换设备 framework 目录, 20261029-start -->
    <button id="adbBtn" class="btn adb-entry" type="button" title="检测 ADB 连接，替换设备 framework / framework-res / services 等文件">
      <span class="adb-dot" id="adbDot"></span>
      <span class="adb-entry-label">ADB</span>
      <span class="adb-entry-sub" id="adbEntrySub">未连接</span>
    </button>
    <!-- prize add by yanliang for 顶栏 ADB 入口：检测连接并替换设备 framework 目录, 20261029-end -->

    <!-- prize add by yanliang for 顶栏截图入口：抓设备当前界面看截图 + 布局树, 20261029-start -->
    <button id="shotBtn" class="btn icon" type="button" title="抓取设备当前界面：左边截图，右边布局树" aria-label="抓取设备界面">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.2-1.6A1 1 0 0 1 9.5 5h5a1 1 0 0 1 .8.4L16.5 7h2A1.5 1.5 0 0 1 20 8.5v8A1.5 1.5 0 0 1 18.5 18h-13A1.5 1.5 0 0 1 4 16.5z"></path>
        <circle cx="12" cy="12.5" r="3.2"></circle>
      </svg>
    </button>
    <!-- prize add by yanliang for 顶栏截图入口：抓设备当前界面看截图 + 布局树, 20261029-end -->

    <div class="top-tools">
      <label class="field">
        <span class="field-label">分支</span>
        <select id="refSelect"></select>
      </label>
      <input id="search" type="text" spellcheck="false" placeholder="搜索提交 / 作者 / hash" />
      <button id="themeToggle" class="btn icon" title="切换主题"></button>
    </div>
  </header>

  <div id="compareBar" class="compare-bar hidden">
    <span id="compareText" class="compare-text">已选 0 个提交</span>
    <button id="runCompare" class="btn primary small">比对</button>
    <button id="clearCompare" class="btn ghost small">清除</button>
  </div>

  <main class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="repo-card" id="repoCard">
        <div class="repo-empty">
          <div class="repo-empty-icon">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
          </div>
          <p>填入本地仓库路径后打开<br /><span>历史只读；工作区可暂存 / 忽略 / 提交</span></p>
        </div>
      </div>
      <ul class="commit-list" id="commitList"></ul>
      <div class="list-foot" id="listFoot"></div>
    </aside>

    <div class="resizer" id="resizer" title="拖动调整提交列表宽度，双击复位"></div>

    <section class="detail" id="detail">
      <div class="detail-empty" id="detailEmpty">
        <h2>选择一个提交</h2>
        <p>查看它改动了哪些文件、每一行的增删，也可以勾选两个提交做跨版本比对。</p>
      </div>
      <div class="detail-body hidden" id="detailBody">
        <div class="commit-head" id="commitHead"></div>
        <div class="diff-toolbar" id="diffToolbar"></div>
        <div class="diff-view" id="diffScroll"></div>
      </div>
    </section>
  </main>
</div>

<!-- prize add by yanliang for 提交面板容器, 20261022-start -->
<div class="modal-mask hidden" id="commitMask">
  <div class="commit-modal" id="commitModal" role="dialog" aria-modal="true" aria-label="提交暂存区的改动"></div>
</div>
<!-- prize add by yanliang for 提交面板容器, 20261022-end -->

<!-- prize add by yanliang for 目录选择面板容器, 20261023-start -->
<div class="modal-mask hidden" id="finderMask">
  <div class="finder-modal" id="finderModal" role="dialog" aria-modal="true" aria-label="选择仓库目录"></div>
</div>
<!-- prize add by yanliang for 目录选择面板容器, 20261023-end -->

<!-- prize add by yanliang for ADB 框架替换面板容器, 20261029-start -->
<div class="modal-mask hidden" id="adbMask">
  <div class="adb-modal" id="adbModal" role="dialog" aria-modal="true" aria-label="ADB 框架目录替换"></div>
</div>
<!-- prize add by yanliang for ADB 框架替换面板容器, 20261029-end -->

<!-- prize add by yanliang for 设备截图页容器（整页覆盖，不是弹窗）, 20261029-start -->
<div class="shot-page hidden" id="shotPage" role="dialog" aria-modal="true" aria-label="设备截图与布局"></div>
<!-- prize add by yanliang for 设备截图页容器（整页覆盖，不是弹窗）, 20261029-end -->

<script src="/app.js"></script>
<!-- prize add by yanliang for 源码跳转：Ctrl+Click 找定义, 20261026-start -->
<script src="/jump.js"></script>
<!-- prize add by yanliang for 源码跳转：Ctrl+Click 找定义, 20261026-end -->
<!-- prize add by yanliang for 问 AI：复制上下文并跳到 DeepSeek Harness web, 20261026-start -->
<script src="/ai-ask.js"></script>
<!-- prize add by yanliang for 问 AI：复制上下文并跳到 DeepSeek Harness web, 20261026-end -->
<!-- prize add by yanliang for 查找引用：右键菜单 + Ctrl+Alt+Click 反向查谁在用, 20261027-start -->
<script src="/refs.js"></script>
<!-- prize add by yanliang for 查找引用：右键菜单 + Ctrl+Alt+Click 反向查谁在用, 20261027-end -->
<!-- prize add by yanliang for ADB 框架目录替换：顶栏入口 + 面板, 20261029-start -->
<script src="/adb.js"></script>
<!-- prize add by yanliang for ADB 框架目录替换：顶栏入口 + 面板, 20261029-end -->
<!-- prize add by yanliang for 设备截图页：抓屏 + 布局树, 20261029-start -->
<script src="/shot.js"></script>
<!-- prize add by yanliang for 设备截图页：抓屏 + 布局树, 20261029-end -->
</body>
</html>
